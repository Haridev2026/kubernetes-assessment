apiVersion:  apps/v1
kind:  Deployment
metadata:
  name:  app-deployment
  namespace:  devops-assessment
spec:
  replicas:  2
  selector:
    matchLabels:
      app:  demo-app
  template:
    metadata:
      labels:
        app:  demo-app
    spec:
      containers:
        - name:  demo-app
          image:  nginx:latest
          ports:
            - containerPort: 80

