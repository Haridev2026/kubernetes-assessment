apiVersion:  apps/v1
kind:  Deployment
metadata:
  name:  storage-nginx
  namespace:  devops-assessment
spec:
  replicas:  1
  selector:
    matchLabels:
      app:  storage-nginx
  template:
    metadata:
      labels:
        app:  storage-nginx
    spec:
      containers:
        - name:  nginx
          image:  nginx:latest
          ports:
            - containerPort:  80
          volumeMounts:
            - name:  nginx-storage
              mountPath:  /usr/share/nginx/html/data
      volumes:
        - name:  nginx-storage
          persistentVolumeClaim:
            claimName:  nginx-pvc

